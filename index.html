<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTO - Crash Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo-area">TOTO</div>
        <div class="user-balance">Bal: <span id="balance-val">10,000.00</span> KES</div>
    </div>

    <div class="game-wrapper">
        <div class="history-bar" id="history-bar">
            <div class="hist-badge hist-low">1.15x</div>
            <div class="hist-badge hist-mid">2.40x</div>
            <div class="hist-badge hist-high">12.50x</div>
            <div class="hist-badge hist-low">1.02x</div>
            <div class="hist-badge hist-mid">4.88x</div>
        </div>

        <div class="arena">
            <canvas id="gameCanvas"></canvas>
            <div class="multiplier-display" id="multiplier-text">1.00x</div>
            <div class="status-text" id="status-text">Waiting for next round...</div>
        </div>

        <div class="bet-panel">
            <div class="bet-tabs">
                <div class="tab active">Bet</div>
                <div class="tab">Auto</div>
            </div>
            
            <div class="bet-row">
                <div class="bet-inputs">
                    <div class="input-group">
                        <button class="adjust" onclick="adjustBet(-10)">-</button>
                        <input type="number" id="bet-amount" value="100">
                        <button class="adjust" onclick="adjustBet(10)">+</button>
                    </div>
                    <div class="quick-amounts">
                        <div class="quick-btn" onclick="setBet(100)">100</div>
                        <div class="quick-btn" onclick="setBet(200)">200</div>
                        <div class="quick-btn" onclick="setBet(500)">500</div>
                        <div class="quick-btn" onclick="setBet(1000)">1000</div>
                    </div>
                </div>

                <div class="action-btn-wrapper">
                    <button id="action-btn" class="main-action-btn btn-bet" onclick="handleAction()">Bet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
